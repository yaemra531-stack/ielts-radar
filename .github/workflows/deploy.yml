name: 🚀 部署到 GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 确保静态数据与测试样例就绪
        run: |
          mkdir -p public/data public/examples
          cp -f data/radar-store.json public/data/radar-store.json || true
          cp -rf examples/* public/examples/ || true

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
